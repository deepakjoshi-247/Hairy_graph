[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hairy-graph"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi",
    "uvicorn",
    "fastembed",
    "numpy",
    "pydantic",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["hairy_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
